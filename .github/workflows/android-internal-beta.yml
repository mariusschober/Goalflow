name: Android internal beta (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "internal-beta" to build the signed staging APK'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact integration candidate with a green Beta Gate
        env:
          GH_TOKEN: ${{ github.token }}
          INTERNAL_BETA_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$INTERNAL_BETA_CONFIRMATION" != "internal-beta" ]; then
            echo "Internal beta confirmation must be exactly 'internal-beta'." >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/integration/beta" ]; then
            echo "Signed internal betas may only be dispatched from integration/beta." >&2
            exit 1
          fi
          runs="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=integration%2Fbeta&event=push&status=success&head_sha=$GITHUB_SHA&per_page=100")"
          run_id="$(printf '%s' "$runs" | jq -r --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "integration/beta" and .event == "push" and .conclusion == "success")][0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "Commit $GITHUB_SHA has no successful Beta Gate push run on integration/beta." >&2
            exit 1
          fi
          jobs="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
          successful="$(printf '%s' "$jobs" | jq \
            '[.jobs[] | select(.name == "beta-gate" and .status == "completed" and .conclusion == "success")] | length')"
          if [ "$successful" -ne 1 ]; then
            echo "Integration Beta Gate run $run_id does not contain exactly one successful beta-gate job." >&2
            exit 1
          fi
          echo "Internal beta source verified at $GITHUB_SHA using Beta Gate run $run_id."

  build-signed-apk:
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: internal-beta
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_CERT_FINGERPRINT: ${{ secrets.EXPECTED_CERT_FINGERPRINT }}
      GOALFLOW_STAGING_APP_ORIGIN: ${{ secrets.GOALFLOW_STAGING_APP_ORIGIN }}
      GOALFLOW_STAGING_SUPABASE_URL: ${{ secrets.GOALFLOW_STAGING_SUPABASE_URL }}
      GOALFLOW_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.GOALFLOW_STAGING_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate signing and staging configuration
        run: |
          set -euo pipefail
          missing=0
          for name in \
            ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
            EXPECTED_CERT_FINGERPRINT GOALFLOW_STAGING_APP_ORIGIN GOALFLOW_STAGING_SUPABASE_URL \
            GOALFLOW_STAGING_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required internal-beta secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Internal beta configuration is incomplete." >&2
            exit 1
          fi
          case "$GOALFLOW_STAGING_APP_ORIGIN" in
            https://*) ;;
            *) echo "The staging application origin must use HTTPS." >&2; exit 1 ;;
          esac
          case "$GOALFLOW_STAGING_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "The staging Supabase URL is invalid." >&2; exit 1 ;;
          esac
          case "$GOALFLOW_STAGING_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "A current Supabase publishable key is required; server and legacy keys are refused." >&2; exit 1 ;;
          esac
          expected="$(printf '%s' "$EXPECTED_CERT_FINGERPRINT" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "EXPECTED_CERT_FINGERPRINT must normalize to 64 hexadecimal characters." >&2
            exit 1
          fi
      - name: Verify frozen persistence contracts
        run: |
          set -euo pipefail
          node scripts/verify-migration-hashes.mjs
          node scripts/verify-room-schema-hashes.mjs
          node scripts/check-durable-identifiers.mjs
      - name: Build, inspect, and checksum signed staging APK
        run: |
          set -euo pipefail
          ./android-native/gradlew -p android-native assembleProductionRelease \
            -PgoalflowApiOrigin="$GOALFLOW_STAGING_APP_ORIGIN" \
            -PgoalflowSupabaseUrl="$GOALFLOW_STAGING_SUPABASE_URL" \
            -PgoalflowSupabasePublishableKey="$GOALFLOW_STAGING_SUPABASE_PUBLISHABLE_KEY"
          mapfile -t apks < <(find android-native/app/build/outputs/apk/production/release \
            -type f -name '*.apk' -print | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "The internal beta build must produce exactly one release APK." >&2
            exit 1
          fi
          apk="${apks[0]}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -u+x -print | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "apksigner was not found." >&2
            exit 1
          fi
          certificate_output="$(mktemp)"
          trap 'rm -f "$certificate_output"' EXIT
          "$apksigner" verify --verbose --print-certs "$apk" >"$certificate_output" 2>&1
          mapfile -t signer_fingerprints < <(sed -n \
            's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' "$certificate_output")
          if [ "${#signer_fingerprints[@]}" -ne 1 ]; then
            echo "The internal beta APK must contain exactly one signer certificate." >&2
            exit 1
          fi
          expected="$(printf '%s' "$EXPECTED_CERT_FINGERPRINT" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          actual="$(printf '%s' "${signer_fingerprints[0]}" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [ "$actual" != "$expected" ]; then
            echo "Internal beta certificate fingerprint mismatch." >&2
            exit 1
          fi
          ANDROID_EXPECT_SIGNED=1 bash android-native/scripts/verify-signing-strict.sh "$apk"
          GOALFLOW_APK_LABEL=INTERNAL-BETA bash android-native/scripts/diagnose-apk.sh "$apk"
          dex_strings="$(mktemp)"
          trap 'rm -f "$certificate_output" "$dex_strings"' EXIT
          unzip -p "$apk" 'classes*.dex' | strings >"$dex_strings"
          for expected_public_value in \
            "$GOALFLOW_STAGING_APP_ORIGIN" "$GOALFLOW_STAGING_SUPABASE_URL" \
            "$GOALFLOW_STAGING_SUPABASE_PUBLISHABLE_KEY"; do
            if ! grep -Fqx "$expected_public_value" "$dex_strings"; then
              echo "The signed APK does not contain the exact staging public configuration." >&2
              exit 1
            fi
          done
          sha256sum "$apk" >"$apk.sha256"
          sha256sum --check "$apk.sha256"
          printf 'commit=%s\nbranch=integration/beta\nchannel=internal-beta\nsigning_fingerprint_sha256=%s\n' \
            "$GITHUB_SHA" "$actual" >"$apk.provenance.txt"
          echo "SIGNED_INTERNAL_APK=PASS"
          echo "SIGNED_INTERNAL_APK_SHA256=$(awk '{print $1}' "$apk.sha256")"
      - name: Upload verified internal beta APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goalflow-native-signed-internal-beta
          path: |
            android-native/app/build/outputs/apk/production/release/*.apk
            android-native/app/build/outputs/apk/production/release/*.apk.sha256
            android-native/app/build/outputs/apk/production/release/*.apk.provenance.txt
          if-no-files-found: error
          retention-days: 30

  internal-beta-gate:
    needs: [verify-candidate, build-signed-apk]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require verified signed artifact
        run: |
          set -euo pipefail
          if [ "${{ needs.verify-candidate.result }}" != "success" ]; then
            echo "Candidate verification failed." >&2
            exit 1
          fi
          if [ "${{ needs.build-signed-apk.result }}" != "success" ]; then
            echo "Signed APK build or verification failed." >&2
            exit 1
          fi
          echo "android-internal-beta PASS"
