name: Release (protected, manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to confirm you intend to create a signed authorized release'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-signing-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Validate all signing secrets present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_FINGERPRINT: ${{ secrets.EXPECTED_CERT_FINGERPRINT }}
        run: |
          if [ "${{ inputs.confirm }}" != "release" ]; then
            echo "Release confirmation must be exactly 'release' — got '${{ inputs.confirm }}'" >&2
            exit 1
          fi
          missing=0
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD EXPECTED_CERT_FINGERPRINT; do
            val=$(eval echo \$$var)
            if [ -z "$val" ]; then
              echo "Missing required signing secret: $var" >&2
              missing=1
            else
              echo "$var present (length ${#val})"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "FAIL: all signing secrets must be present for release — failing closed" >&2
            exit 1
          fi
          echo "All signing secrets present"

  release:
    needs: verify-signing-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:migrations
      - run: node scripts/verify-migration-hashes.mjs
      - run: node scripts/verify-room-schema-hashes.mjs
      - name: Cache native Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-native-${{ hashFiles('android-native/**/*.gradle*', 'android-native/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-native-
      - name: Build signed native production release (requires all secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./android-native/gradlew -p android-native assembleProductionRelease --stacktrace --info
          ls -l android-native/app/build/outputs/apk/production/release/*.apk
      - name: Verify certificate fingerprint (fail closed)
        env:
          EXPECTED_CERT_FINGERPRINT: ${{ secrets.EXPECTED_CERT_FINGERPRINT }}
        run: |
          apk=$(find android-native/app/build/outputs/apk/production/release -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then echo "No release APK found" >&2; exit 1; fi
          # Find apksigner
          APKSIGNER=""
          for p in "$ANDROID_HOME/build-tools"/*/apksigner; do
            if [ -x "$p" ]; then APKSIGNER="$p"; break; fi
          done
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found" >&2; exit 1; fi
          "$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1 | tee /tmp/certs.txt
          if [ -n "$EXPECTED_CERT_FINGERPRINT" ]; then
            if ! grep -q "$EXPECTED_CERT_FINGERPRINT" /tmp/certs.txt; then
              echo "Certificate fingerprint mismatch — expected $EXPECTED_CERT_FINGERPRINT" >&2
              cat /tmp/certs.txt >&2
              exit 1
            fi
            echo "Certificate fingerprint verified"
          else
            echo "No expected fingerprint supplied — skipping fingerprint check but still verifying no debug cert"
            if grep -q "CN=Android Debug" /tmp/certs.txt; then
              echo "Release APK signed with debug cert — failing closed" >&2
              exit 1
            fi
          fi
          # Also run strict signing script which will FAIL if SKIP in release context
          ANDROID_EXPECT_SIGNED=1 bash android-native/scripts/verify-signing-strict.sh "$apk"
      - name: Create digests and provenance
        run: |
          apk=$(find android-native/app/build/outputs/apk/production/release -name '*.apk' -print -quit)
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"
          echo "Provenance: $(git rev-parse HEAD) built at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$apk.provenance.txt"
          cat "$apk.provenance.txt"
          # Also for AAB if present
          aab=$(find android-native/app/build/outputs -name '*.aab' -print -quit || true)
          if [ -n "$aab" ]; then
            sha256sum "$aab" > "$aab.sha256"
            cat "$aab.sha256"
          fi
      - name: Upload signed release artifacts (authorized)
        uses: actions/upload-artifact@v4
        with:
          name: goalflow-signed-release
          path: |
            android-native/app/build/outputs/apk/production/release/*.apk
            android-native/app/build/outputs/apk/production/release/*.apk.sha256
            android-native/app/build/outputs/apk/production/release/*.apk.provenance.txt
            android-native/app/build/outputs/**/*.aab
            android-native/app/build/outputs/**/*.aab.sha256
          if-no-files-found: error

  canonical-gate-release:
    needs: [verify-signing-secrets, release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check release gate
        run: |
          echo "verify-signing-secrets=${{ needs.verify-signing-secrets.result }} release=${{ needs.release.result }}"
          if [ "${{ needs.verify-signing-secrets.result }}" != "success" ]; then echo "verify-signing-secrets failed" >&2; exit 1; fi
          if [ "${{ needs.release.result }}" != "success" ]; then echo "release failed" >&2; exit 1; fi
          echo "release canonical-gate PASS"
