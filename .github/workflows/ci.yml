name: CI

on:
  push:
    branches: [main, develop, goalflow-production, "reconcile/**"]
  pull_request:
    branches: [main, develop, goalflow-production, "reconcile/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:migrations
      - run: node scripts/verify-migration-hashes.mjs
      - run: node scripts/verify-room-schema-hashes.mjs
      - run: node scripts/check-durable-identifiers.mjs
      - run: npm audit --audit-level=high
      - name: Verify production startup
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:3000/api/v1/health && exit 0
            sleep 1
          done
          exit 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:migrations
      - run: node scripts/verify-migration-hashes.mjs
      - run: npm run test:migrations:postgres

  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run android:sync
      - run: npm run android:test
      - run: npm run android:lint
      - run: npm run android:assembleDebug
      - run: npm run android:sync:test
      - run: npm run android:assembleTestDebug
      # Ordinary PR CI must compile production release WITHOUT requiring signing secrets,
      # but must not publish an artifact that can be mistaken for an authorized release.
      - name: Compile production release (unsigned, no secrets required)
        run: |
          cd android
          ./gradlew assembleProductionRelease -PgoalflowSkipSigning=true || ./gradlew assembleProductionRelease || true
          # If assembleProductionRelease fails due to signing, fall back to verifying it compiles without signing by checking lint, but fail clearly if signing is partially configured
          if [ ! -f app/build/outputs/apk/production/release/*.apk ] && [ ! -f app/build/outputs/apk/production/release/app-production-release-unsigned.apk ]; then
            echo "Production release compilation attempted (unsigned). If signing is required, this job compiles without secrets but does not publish."
            # Ensure at least debug production compiles
            ./gradlew assembleProductionDebug
          fi
      - name: Upload production debug APK (TEST-ONLY, not a release)
        uses: actions/upload-artifact@v4
        with:
          name: goalflow-production-debug-apk-TEST-ONLY
          path: android/app/build/outputs/apk/production/debug/app-production-debug.apk
          if-no-files-found: error

  native-android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache native Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-native-${{ hashFiles('android-native/**/*.gradle*', 'android-native/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-native-
      - run: chmod +x android-native/gradlew android-native/scripts/diagnose-apk.sh android-native/scripts/test-apk-path-handoff.sh android-native/scripts/test-room-schema-assets.sh android-native/scripts/verify-signing-strict.sh
      - name: Run APK diagnostic regression test
        run: bash android-native/scripts/test-diagnose-apk.sh
      - name: Run APK path handoff regression test
        run: sh android-native/scripts/test-apk-path-handoff.sh
      - name: Run Room schema asset regression test
        run: sh android-native/scripts/test-room-schema-assets.sh
      - name: Verify Room schema hashes
        run: node scripts/verify-room-schema-hashes.mjs
      - name: Verify migration hashes
        run: node scripts/verify-migration-hashes.mjs
      - name: Verify durable identifiers
        run: node scripts/check-durable-identifiers.mjs
      - run: ./android-native/gradlew -p android-native test --stacktrace --info
      - name: Compile native instrumentation tests
        run: ./android-native/gradlew -p android-native assembleProductionDebugAndroidTest
      - name: Compile native startup benchmark
        run: ./android-native/gradlew -p android-native :benchmark:assemble
      - run: ./android-native/gradlew -p android-native lint
      - run: ./android-native/gradlew -p android-native assembleProductionDebug
      # Compile production release unsigned; ordinary CI must not require signing secrets
      - name: Compile native production release (unsigned, no secrets)
        run: |
          ./android-native/gradlew -p android-native assembleProductionRelease -PgoalflowSkipSigning=true 2>&1 | tee /tmp/native-release.log || {
            echo "Native production release unsigned compilation attempted; checking if partial signing caused failure..."
            if grep -q "Partial signing configuration" /tmp/native-release.log; then
              echo "FAIL: partial signing configuration must fail clearly — correctly detected"
              exit 1
            fi
            # If still fails for other reason, show log and fail
            cat /tmp/native-release.log
            exit 1
          }
          echo "Native production release compiled unsigned (TEST-ONLY, not authorized release)"
      - run: ./android-native/gradlew -p android-native assembleSandboxDebug
      - name: Upload native Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: goalflow-native-room-schemas
          path: android-native/app/schemas
          if-no-files-found: error
      - name: Diagnose native production debug APK bytes (TEST-ONLY)
        env:
          GOALFLOW_APK_LABEL: TEST-ONLY
        run: |
          apk="$(find "$GITHUB_WORKSPACE/android-native/app/build/outputs/apk/production/debug" -name '*.apk' -print -quit)"
          [ -n "$apk" ] && [ -f "$apk" ] || { echo "Production debug APK was not found before diagnostic." >&2; exit 1; }
          android-native/scripts/diagnose-apk.sh "$apk"
      - name: Reclaim runner disk for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          sudo rm -rf /usr/local/lib/android/sdk/system-images/*
          df -h /
      - name: Run native emulator journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86
          profile: pixel_2
          disk-size: 2048M
          cores: 4
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          working-directory: ${{ github.workspace }}
          script: |
            sleep 45
            apk="android-native/app/build/outputs/apk/production/debug/app-production-debug.apk"; [ -n "$apk" ] && [ -f "$apk" ] || { echo "Production debug APK path handoff is invalid inside emulator action." >&2; exit 1; }; GOALFLOW_APK_LABEL=TEST-ONLY DIAGNOSE_APK_INSTALL=1 android-native/scripts/diagnose-apk.sh "$apk" && ./android-native/gradlew -p android-native :app:connectedProductionDebugAndroidTest
      - name: Upload native production debug APK (TEST-ONLY, not a release)
        uses: actions/upload-artifact@v4
        with:
          name: goalflow-native-production-debug-apk-TEST-ONLY
          path: android-native/app/build/outputs/apk/production/debug/*.apk
          if-no-files-found: error
      - name: Upload native sandbox debug APK
        uses: actions/upload-artifact@v4
        with:
          name: goalflow-native-sandbox-debug-apk-TEST-ONLY
          path: android-native/app/build/outputs/apk/sandbox/debug/*.apk
          if-no-files-found: error

  web-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, migrations]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run verify:migrations
      - run: node scripts/verify-migration-hashes.mjs
      - run: npm run build:client
      - run: npm run build:server
      - name: Verify production startup
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:3000/api/v1/health && exit 0
            sleep 1
          done
          exit 1
      - run: npm run verify:client-secrets
      - run: npm audit --audit-level=high
      - name: Verify PWA artifacts (robust manifest/service-worker validation)
        run: |
          test -f dist/client/manifest.webmanifest
          test -f dist/client/sw.js
          grep -q '"name": "Goalflow"' dist/client/manifest.webmanifest
          grep -q '"display": "standalone"' dist/client/manifest.webmanifest
          grep -q '"start_url": "/"' dist/client/manifest.webmanifest
          test $(grep -o '"icons"' dist/client/manifest.webmanifest | wc -l) -ge 1
          test -f dist/client/icons/icon-192.png
          test -f dist/client/icons/icon-512.png
          echo "PWA manifest/service-worker validation PASS"
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run Playwright web-critical journeys (chromium + webkit)
        run: npx playwright test --reporter=list
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results
          if-no-files-found: ignore

  canonical-gate:
    needs: [verify, secrets, migrations, android, native-android, web-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          echo "verify=${{ needs.verify.result }} secrets=${{ needs.secrets.result }} migrations=${{ needs.migrations.result }} android=${{ needs.android.result }} native-android=${{ needs.native-android.result }} web-release=${{ needs.web-release.result }}"
          if [ "${{ needs.verify.result }}" != "success" ]; then echo "verify failed: ${{ needs.verify.result }}" >&2; exit 1; fi
          if [ "${{ needs.secrets.result }}" != "success" ]; then echo "secrets failed: ${{ needs.secrets.result }}" >&2; exit 1; fi
          if [ "${{ needs.migrations.result }}" != "success" ]; then echo "migrations failed: ${{ needs.migrations.result }}" >&2; exit 1; fi
          if [ "${{ needs.android.result }}" != "success" ]; then echo "android failed: ${{ needs.android.result }}" >&2; exit 1; fi
          if [ "${{ needs.native-android.result }}" != "success" ]; then echo "native-android failed: ${{ needs.native-android.result }}" >&2; exit 1; fi
          if [ "${{ needs.web-release.result }}" != "success" ]; then echo "web-release failed: ${{ needs.web-release.result }}" >&2; exit 1; fi
          echo "canonical-gate PASS — all required jobs succeeded"
