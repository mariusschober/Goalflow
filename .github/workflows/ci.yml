name: CI

on:
  push:
    branches: [main, goalflow-production]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:migrations
      - run: npm audit --audit-level=high
      - name: Verify production startup
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:3000/api/v1/health && exit 0
            sleep 1
          done
          exit 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:migrations
      - run: npm run test:migrations:postgres

  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run android:sync
      - run: npm run android:test
      - run: npm run android:lint
      - run: npm run android:assembleDebug
      - run: npm run android:sync:test
      - run: npm run android:assembleTestDebug
      - name: Upload production debug APK
        uses: actions/upload-artifact@v4
        with:
          name: goalflow-production-debug-apk
          path: android/app/build/outputs/apk/production/debug/app-production-debug.apk
          if-no-files-found: error
      - name: Upload isolated test APK
        uses: actions/upload-artifact@v4
        with:
          name: goalflow-test-debug-apk
          path: android/app/build/outputs/apk/sandbox/debug/app-sandbox-debug.apk
          if-no-files-found: error

  native-android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache native Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-native-${{ hashFiles('android-native/**/*.gradle*', 'android-native/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-native-
      - run: chmod +x android-native/gradlew
      - run: ./android-native/gradlew -p android-native test
      - name: Compile native instrumentation tests
        run: ./android-native/gradlew -p android-native assembleProductionDebugAndroidTest
      - name: Compile native startup benchmark
        run: ./android-native/gradlew -p android-native :benchmark:assemble
      - run: ./android-native/gradlew -p android-native lint
      - run: ./android-native/gradlew -p android-native assembleProductionDebug
      - run: ./android-native/gradlew -p android-native assembleProductionRelease
      - run: ./android-native/gradlew -p android-native assembleSandboxDebug
      - name: Run native emulator journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: ./android-native/gradlew -p android-native connectedProductionDebugAndroidTest
      - name: Upload native production debug APK
        uses: actions/upload-artifact@v4
        with:
          name: goalflow-native-production-debug-apk
          path: android-native/app/build/outputs/apk/production/debug/*.apk
          if-no-files-found: error
      - name: Upload native sandbox debug APK
        uses: actions/upload-artifact@v4
        with:
          name: goalflow-native-sandbox-debug-apk
          path: android-native/app/build/outputs/apk/sandbox/debug/*.apk
          if-no-files-found: error
