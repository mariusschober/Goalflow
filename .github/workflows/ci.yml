name: Beta Gate

on:
  push:
    branches: [main, develop, goalflow-production, "reconcile/**", "integration/**", "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, develop, goalflow-production, "reconcile/**", "integration/**"]

permissions:
  contents: read

# Keep the newest candidate authoritative without cancelling work on another
# branch or pull request. A cancelled superseded run is never release evidence;
# the latest commit must still complete every required job.
concurrency:
  group: beta-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:migrations
      - run: node scripts/verify-migration-hashes.mjs
      - run: node scripts/verify-room-schema-hashes.mjs
      - run: node scripts/check-durable-identifiers.mjs
      - run: npm audit --audit-level=high
      - name: Verify production startup
        run: npm run verify:server
      - name: Verify one-shot maintenance fails closed
        run: npm run verify:maintenance

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan event commit range for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: false
      - name: Scan complete history and candidate tree
        run: |
          echo "Scanning complete Git history and candidate HEAD $(git rev-parse HEAD)"
          gitleaks git --config .gitleaks.toml --redact --verbose --log-opts="--all" .
          gitleaks dir --config .gitleaks.toml --redact --verbose .

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Start runner PostgreSQL 16
        run: |
          set -euo pipefail
          installed_major="$(psql --version | awk '{ split($3, version, "."); print version[1] }')"
          [ "$installed_major" = "16" ] || {
            echo "The migration gate requires PostgreSQL 16; runner provided major $installed_major." >&2
            exit 1
          }
          sudo systemctl start postgresql.service
          sudo -u postgres env -u PGHOST -u PGPORT -u PGUSER -u PGPASSWORD \
            psql --set=ON_ERROR_STOP=1 \
            --command="ALTER USER postgres PASSWORD 'postgres'"
          pg_isready --host="$PGHOST" --port="$PGPORT" --username="$PGUSER"
      - run: npm ci
      - run: npm run verify:migrations
      - run: node scripts/verify-migration-hashes.mjs
      - run: npm run test:migrations:postgres
      - run: bash scripts/test-postgres-migration-case-regression.sh

  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run android:sync
      - run: npm run android:test
      - run: npm run android:lint
      - run: npm run android:assembleDebug
      - run: npm run android:sync:test
      - run: npm run android:assembleTestDebug
      # Ordinary PR CI must compile production release WITHOUT requiring signing secrets,
      # but must not publish an artifact that can be mistaken for an authorized release.
      - name: Compile production release (unsigned, no secrets required)
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleProductionRelease -PgoalflowSkipSigning=true
          apk="$(find app/build/outputs/apk/production/release -name '*-unsigned.apk' -print -quit)"
          [ -n "$apk" ] && [ -f "$apk" ] || { echo "Unsigned production release APK was not produced." >&2; exit 1; }
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          [ -n "$apksigner" ] && [ -x "$apksigner" ] || { echo "apksigner was not found." >&2; exit 1; }
          if "$apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "Ordinary CI produced a signed release artifact; refusing to continue." >&2
            exit 1
          fi
          echo "Unsigned production release compiled and verified: $apk"
      - name: Upload production debug APK (TEST-ONLY, not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goalflow-production-debug-apk-TEST-ONLY
          path: android/app/build/outputs/apk/production/debug/app-production-debug.apk
          if-no-files-found: error

  native-android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache native Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-native-${{ hashFiles('android-native/**/*.gradle*', 'android-native/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-native-
      - run: chmod +x android-native/gradlew android-native/scripts/diagnose-apk.sh android-native/scripts/test-apk-path-handoff.sh android-native/scripts/test-public-key-gate.sh android-native/scripts/test-room-schema-assets.sh android-native/scripts/verify-signing-strict.sh
      - name: Prove release signing checks fail closed
        run: bash android-native/scripts/test-signing-gate.sh
      - name: Prove Android rejects Supabase server secrets
        run: bash android-native/scripts/test-public-key-gate.sh
      - name: Run APK diagnostic regression test
        run: bash android-native/scripts/test-diagnose-apk.sh
      - name: Run APK path handoff regression test
        run: sh android-native/scripts/test-apk-path-handoff.sh
      - name: Run Room schema asset regression test
        run: sh android-native/scripts/test-room-schema-assets.sh
      - name: Verify Room schema hashes
        run: node scripts/verify-room-schema-hashes.mjs
      - name: Verify migration hashes
        run: node scripts/verify-migration-hashes.mjs
      - name: Verify durable identifiers
        run: node scripts/check-durable-identifiers.mjs
      - run: ./android-native/gradlew -p android-native test --stacktrace --info
      - name: Compile native instrumentation tests
        run: ./android-native/gradlew -p android-native assembleProductionDebugAndroidTest
      - name: Compile native startup benchmark
        run: ./android-native/gradlew -p android-native :benchmark:assemble
      - run: ./android-native/gradlew -p android-native lint
      - run: ./android-native/gradlew -p android-native assembleProductionDebug
      # Compile production release unsigned; ordinary CI must not require signing secrets
      - name: Compile native production release (unsigned, no secrets)
        run: |
          set -euo pipefail
          ./android-native/gradlew -p android-native assembleProductionRelease -PgoalflowSkipSigning=true
          apk="$(find android-native/app/build/outputs/apk/production/release -name '*-unsigned.apk' -print -quit)"
          [ -n "$apk" ] && [ -f "$apk" ] || { echo "Unsigned native production release APK was not produced." >&2; exit 1; }
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          [ -n "$apksigner" ] && [ -x "$apksigner" ] || { echo "apksigner was not found." >&2; exit 1; }
          if "$apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "Ordinary CI produced a signed native release artifact; refusing to continue." >&2
            exit 1
          fi
          echo "Unsigned native production release compiled and verified: $apk"
      - run: ./android-native/gradlew -p android-native assembleSandboxDebug
      - name: Upload native Room schemas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goalflow-native-room-schemas
          path: android-native/app/schemas
          if-no-files-found: error
      - name: Diagnose native production debug APK bytes (TEST-ONLY)
        env:
          GOALFLOW_APK_LABEL: TEST-ONLY
        run: |
          set -euo pipefail
          apk="$(find "$GITHUB_WORKSPACE/android-native/app/build/outputs/apk/production/debug" -name '*.apk' -print -quit)"
          [ -n "$apk" ] && [ -f "$apk" ] || { echo "Production debug APK was not found before diagnostic." >&2; exit 1; }
          android-native/scripts/diagnose-apk.sh "$apk"
      - name: Reclaim runner disk for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          sudo rm -rf /usr/local/lib/android/sdk/system-images/*
          df -h /
      - name: Run native emulator journey
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86
          profile: pixel_2
          disk-size: 2048M
          cores: 4
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          working-directory: ${{ github.workspace }}
          script: |
            sleep 45
            apk="android-native/app/build/outputs/apk/production/debug/app-production-debug.apk"; [ -n "$apk" ] && [ -f "$apk" ] || { echo "Production debug APK path handoff is invalid inside emulator action." >&2; exit 1; }; GOALFLOW_APK_LABEL=TEST-ONLY GOALFLOW_ALLOW_TEST_APP_DATA_ERASE=1 DIAGNOSE_APK_INSTALL=1 android-native/scripts/diagnose-apk.sh "$apk" && ./android-native/gradlew -p android-native :app:connectedProductionDebugAndroidTest
      - name: Upload native production debug APK (TEST-ONLY, not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goalflow-native-production-debug-apk-TEST-ONLY
          path: android-native/app/build/outputs/apk/production/debug/*.apk
          if-no-files-found: error
      - name: Upload native sandbox debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goalflow-native-sandbox-debug-apk-TEST-ONLY
          path: android-native/app/build/outputs/apk/sandbox/debug/*.apk
          if-no-files-found: error

  web-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, migrations]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run verify:migrations
      - run: node scripts/verify-migration-hashes.mjs
      - run: npm run build:client
      - run: npm run build:mini
      - run: npm run build:server
      - name: Verify production startup
        run: npm run verify:server
      - name: Verify one-shot maintenance fails closed
        run: npm run verify:maintenance
      - run: npm run verify:client-secrets
      - run: npm run verify:client-artifacts
      - run: npm audit --audit-level=high
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run Playwright web-critical journeys (chromium + webkit)
        run: npx playwright test --reporter=list
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-screenshots
          path: test-results
          if-no-files-found: ignore

  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify macOS public configuration
        run: macos-native/scripts/verify-public-config.sh
      - name: Validate macOS property lists
        run: |
          plutil -lint macos-native/GoalflowMac/Resources/Info.plist
          plutil -lint macos-native/GoalflowMac/Resources/PrivacyInfo.xcprivacy
      - name: Parse XcodeGen project specification
        run: ruby -e 'require "yaml"; abort unless YAML.parse_file("macos-native/project.yml")'
      - name: Verify checked-in Xcode source membership
        run: bash macos-native/scripts/verify-project-sources.sh
      - name: Record Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -project macos-native/GoalflowMac.xcodeproj -list
      - name: Run macOS unit tests
        run: |
          xcodebuild test \
            -project macos-native/GoalflowMac.xcodeproj \
            -scheme GoalflowMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/goalflow-macos-tests" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build ad-hoc signed macOS beta candidate
        run: |
          set -euo pipefail
          xcodebuild clean build \
            -project macos-native/GoalflowMac.xcodeproj \
            -scheme GoalflowMac \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/goalflow-macos-release" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES
          app="$RUNNER_TEMP/goalflow-macos-release/Build/Products/Release/GoalflowMac.app"
          [ -d "$app" ] || { echo "macOS application bundle was not produced." >&2; exit 1; }
          codesign --verify --deep --strict "$app"
          macos-native/scripts/verify-built-app-key.sh "$app"
          archive="$RUNNER_TEMP/goalflow-macos-ad-hoc-beta.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 goalflow-macos-ad-hoc-beta.zip > goalflow-macos-ad-hoc-beta.zip.sha256
            shasum -a 256 --check goalflow-macos-ad-hoc-beta.zip.sha256
          )
          printf 'commit=%s\nsigning=ad-hoc\nnotarization=not-requested\n' "$GITHUB_SHA" \
            > "$RUNNER_TEMP/goalflow-macos-ad-hoc-beta.provenance.txt"
      - name: Upload ad-hoc signed macOS beta candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goalflow-macos-ad-hoc-beta
          path: |
            ${{ runner.temp }}/goalflow-macos-ad-hoc-beta.zip
            ${{ runner.temp }}/goalflow-macos-ad-hoc-beta.zip.sha256
            ${{ runner.temp }}/goalflow-macos-ad-hoc-beta.provenance.txt
          if-no-files-found: error
      - name: Upload macOS result bundles on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-test-results
          path: ${{ runner.temp }}/goalflow-macos-tests/Logs/Test
          if-no-files-found: ignore

  hosted-staging:
    name: hosted-staging
    needs: [verify, migrations]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
      GOALFLOW_HOSTED_TEST_CONFIRM: staging
      GOALFLOW_STAGING_APP_ORIGIN: ${{ secrets.GOALFLOW_STAGING_APP_ORIGIN }}
      GOALFLOW_STAGING_SUPABASE_URL: ${{ secrets.GOALFLOW_STAGING_SUPABASE_URL }}
      GOALFLOW_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.GOALFLOW_STAGING_SUPABASE_PUBLISHABLE_KEY }}
      GOALFLOW_STAGING_USER_A_EMAIL: ${{ secrets.GOALFLOW_STAGING_USER_A_EMAIL }}
      GOALFLOW_STAGING_USER_A_PASSWORD: ${{ secrets.GOALFLOW_STAGING_USER_A_PASSWORD }}
      GOALFLOW_STAGING_USER_A_ID: ${{ secrets.GOALFLOW_STAGING_USER_A_ID }}
      GOALFLOW_STAGING_USER_B_EMAIL: ${{ secrets.GOALFLOW_STAGING_USER_B_EMAIL }}
      GOALFLOW_STAGING_USER_B_PASSWORD: ${{ secrets.GOALFLOW_STAGING_USER_B_PASSWORD }}
      GOALFLOW_STAGING_USER_B_ID: ${{ secrets.GOALFLOW_STAGING_USER_B_ID }}
    steps:
      - name: Require complete staging configuration on release candidates
        id: preflight
        run: |
          set -euo pipefail
          names=(
            GOALFLOW_STAGING_APP_ORIGIN
            GOALFLOW_STAGING_SUPABASE_URL
            GOALFLOW_STAGING_SUPABASE_PUBLISHABLE_KEY
            GOALFLOW_STAGING_USER_A_EMAIL
            GOALFLOW_STAGING_USER_A_PASSWORD
            GOALFLOW_STAGING_USER_A_ID
            GOALFLOW_STAGING_USER_B_EMAIL
            GOALFLOW_STAGING_USER_B_PASSWORD
            GOALFLOW_STAGING_USER_B_ID
          )
          missing=0
          for name in "${names[@]}"; do
            if [ -z "${!name:-}" ]; then missing=$((missing + 1)); fi
          done
          if [ "$missing" -gt 0 ] && [ "$missing" -lt "${#names[@]}" ]; then
            echo "Hosted staging configuration is partial; refusing to skip or run ambiguously." >&2
            exit 1
          fi
          if [ "$missing" -eq "${#names[@]}" ]; then
            case "$CANDIDATE_REF" in
              main|develop|integration/*)
                echo "Hosted staging configuration is mandatory for $CANDIDATE_REF." >&2
                exit 1
                ;;
              *)
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "Hosted staging is not configured for this short-lived branch."
                exit 0
                ;;
            esac
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - if: steps.preflight.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: steps.preflight.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - if: steps.preflight.outputs.run == 'true'
        run: npm ci
      - name: Prove hosted authentication, isolation, synchronization, and revocation
        if: steps.preflight.outputs.run == 'true'
        run: npm run test:hosted:staging
      - name: Install hosted browser
        if: steps.preflight.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Prove hosted browser convergence and account isolation
        if: steps.preflight.outputs.run == 'true'
        run: npm run test:hosted:browser
      - name: Upload redacted hosted browser diagnostics
        if: always() && steps.preflight.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-browser-diagnostics
          path: test-results
          if-no-files-found: error

  beta-gate:
    name: beta-gate
    needs: [verify, secrets, migrations, android, native-android, web-release, macos, hosted-staging]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          echo "verify=${{ needs.verify.result }} secrets=${{ needs.secrets.result }} migrations=${{ needs.migrations.result }} android=${{ needs.android.result }} native-android=${{ needs.native-android.result }} web-release=${{ needs.web-release.result }} macos=${{ needs.macos.result }} hosted-staging=${{ needs.hosted-staging.result }}"
          if [ "${{ needs.verify.result }}" != "success" ]; then echo "verify failed: ${{ needs.verify.result }}" >&2; exit 1; fi
          if [ "${{ needs.secrets.result }}" != "success" ]; then echo "secrets failed: ${{ needs.secrets.result }}" >&2; exit 1; fi
          if [ "${{ needs.migrations.result }}" != "success" ]; then echo "migrations failed: ${{ needs.migrations.result }}" >&2; exit 1; fi
          if [ "${{ needs.android.result }}" != "success" ]; then echo "android failed: ${{ needs.android.result }}" >&2; exit 1; fi
          if [ "${{ needs.native-android.result }}" != "success" ]; then echo "native-android failed: ${{ needs.native-android.result }}" >&2; exit 1; fi
          if [ "${{ needs.web-release.result }}" != "success" ]; then echo "web-release failed: ${{ needs.web-release.result }}" >&2; exit 1; fi
          if [ "${{ needs.macos.result }}" != "success" ]; then echo "macos failed: ${{ needs.macos.result }}" >&2; exit 1; fi
          if [ "${{ needs.hosted-staging.result }}" != "success" ]; then echo "hosted-staging failed: ${{ needs.hosted-staging.result }}" >&2; exit 1; fi
          echo "beta-gate PASS — all required jobs succeeded"
