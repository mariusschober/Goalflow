name: CI

on:
  push:
    branches: [main, goalflow-production]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Verify production startup
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:3000/api/v1/health && exit 0
            sleep 1
          done
          exit 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run android:sync
      - run: npm run android:test
      - run: npm run android:lint
      - run: npm run android:assembleDebug
      - run: npm run android:sync:test
      - run: npm run android:assembleTestDebug
      - name: Upload production debug APK
        uses: actions/upload-artifact@v4
        with:
          name: goalflow-production-debug-apk
          path: android/app/build/outputs/apk/production/debug/app-production-debug.apk
          if-no-files-found: error
      - name: Upload isolated test APK
        uses: actions/upload-artifact@v4
        with:
          name: goalflow-test-debug-apk
          path: android/app/build/outputs/apk/sandbox/debug/app-sandbox-debug.apk
          if-no-files-found: error

  native-android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache native Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-native-${{ hashFiles('android-native/**/*.gradle*', 'android-native/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-native-
      - run: chmod +x android-native/gradlew
      - run: ./android-native/gradlew -p android-native test
      - run: ./android-native/gradlew -p android-native lint
      - run: ./android-native/gradlew -p android-native assembleDebug
      - run: ./android-native/gradlew -p android-native assembleRelease
      - name: Upload native debug APK
        uses: actions/upload-artifact@v4
        with:
          name: goalflow-native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-dev-debug.apk
          if-no-files-found: error

