plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.kapt"
    id "org.jetbrains.kotlin.plugin.compose"
}

kotlin {
    jvmToolchain(21)
}

def goalflowBuildConfig = { propertyName ->
    (project.findProperty(propertyName) ?: "").toString()
        .replace('\\', '\\\\')
        .replace('"', '\\"')
}

android {
    namespace "com.mariusschober.goalflow.nativeapp"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    defaultConfig {
        applicationId "com.mariusschober.goalflow"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0-native"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }
        buildConfigField "String", "API_ORIGIN", "\"${goalflowBuildConfig('goalflowApiOrigin')}\""
        buildConfigField "String", "SUPABASE_URL", "\"${goalflowBuildConfig('goalflowSupabaseUrl')}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${goalflowBuildConfig('goalflowSupabaseAnonKey')}\""
        buildConfigField "boolean", "SANDBOX_BUILD", "false"
        buildConfigField "String", "TEST_ACCESS_CODE", "\"\""
    }

    flavorDimensions += "environment"

    productFlavors {
        production {
            dimension "environment"
        }
        sandbox {
            dimension "environment"
            applicationIdSuffix ".sandbox"
            versionNameSuffix "-sandbox"
            buildConfigField "boolean", "SANDBOX_BUILD", "true"
            buildConfigField "String", "TEST_ACCESS_CODE", "\"123456\""
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            testLogging {
                exceptionFormat = "full"
            }
        }
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.activity:activity-compose:1.10.0"
    implementation "androidx.activity:activity-ktx:1.10.0"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.navigation:navigation-compose:2.8.5"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    implementation "androidx.work:work-runtime-ktx:2.10.0"
    debugImplementation "androidx.compose.ui:ui-tooling"

    testImplementation "junit:junit:4.13.2"
    // Android's platform org.json methods are stubs in JVM unit tests.
    // Keep production on the platform API while giving backup tests a real implementation.
    testImplementation "org.json:json:20240303"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "androidx.room:room-testing:2.6.1"
    testImplementation "org.robolectric:robolectric:4.14.1"
    androidTestImplementation platform("androidx.compose:compose-bom:2024.12.01")
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation "androidx.room:room-testing:2.6.1"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}

kapt {
    correctErrorTypes true
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}
